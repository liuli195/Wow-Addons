name: Addon verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  verify:
    name: Windows addon checks
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - name: Restore recorded verification toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = (Get-Content .pr-flow/toolchain.json -Raw | ConvertFrom-Json).tools.'build-and-verify'
          if ($identity.mode -eq 'release') {
            npm install --global --ignore-scripts --no-audit --no-fund "$($identity.packageName)@$($identity.packageVersion)"
          } elseif ($identity.mode -eq 'dev') {
            $source = Join-Path $env:RUNNER_TEMP 'verification-toolchain'
            git clone --no-checkout $identity.sourceRepository $source
            git -C $source checkout --detach $identity.sourceCommit
            $package = python "$source/plugins/tool-lifecycle/pack.py" build-and-verify $env:RUNNER_TEMP
            npm install --global --ignore-scripts --no-audit --no-fund $package
          } else {
            throw 'Unknown toolchain mode'
          }
      - name: Restore SimC source cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/downloads/simc-source.zip
          key: sim2gse-${{ runner.os }}-${{ hashFiles('projects/sim2gse/compatibility/lock.json', 'projects/sim2gse/native/patches/**', 'scripts/dev/sim2gse/build.py') }}
      - name: Prepare pinned tools and API references
        shell: pwsh
        run: ./scripts/dev/setup.ps1
      - name: Build all repository targets
        shell: pwsh
        run: build-and-verify build --project .
      - name: Full verification
        if: ${{ !cancelled() }}
        shell: pwsh
        run: build-and-verify verify --project . --full
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            .local/luals/
            .local/tests/
            .local/sim2gse/build/
            .build-and-verify/runs/
          if-no-files-found: ignore
