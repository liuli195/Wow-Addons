name: Addon verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  verify:
    name: Windows addon checks
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - name: Classify changes
        id: changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ('${{ github.event_name }}' -ne 'pull_request') {
            'needs-build=true' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = git diff --name-only "$env:BASE_SHA...HEAD"
          $lightweight = '^(README\.md$|AGENTS\.md$|docs/|myspec/(changes|specs)/|tests/.+/.+\.md$|projects/[^/]+/README\.md$)'
          $needsBuild = @($changed | Where-Object { $_ -notmatch $lightweight }).Count -gt 0
          "needs-build=$($needsBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@v2
        if: steps.changes.outputs.needs-build == 'true'
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
      - name: Record compiler identity
        if: steps.changes.outputs.needs-build == 'true'
        id: compiler
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compiler = Join-Path $env:MSYS2_LOCATION 'mingw64/bin/g++.exe'
          "sha256=$((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT
      - name: Restore recorded verification toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = (Get-Content .pr-flow/toolchain.json -Raw | ConvertFrom-Json).tools
          foreach ($name in @('myspec', 'build-and-verify')) {
            $identity = $tools.PSObject.Properties[$name].Value
            if ($identity.mode -eq 'release') {
              npm install --global --ignore-scripts --no-audit --no-fund "$($identity.packageName)@$($identity.packageVersion)"
            } elseif ($identity.mode -eq 'dev') {
              $source = Join-Path $env:RUNNER_TEMP $name
              git clone --no-checkout $identity.sourceRepository $source
              git -C $source checkout --detach $identity.sourceCommit
              $package = python "$source/plugins/tool-lifecycle/pack.py" $name $env:RUNNER_TEMP
              npm install --global --ignore-scripts --no-audit --no-fund $package
            } else {
              throw "Unknown toolchain mode: $name"
            }
          }
      - name: Restore SimC source cache
        if: steps.changes.outputs.needs-build == 'true'
        id: simc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/sim2gse-upstream/simc
            .tools/sim2gse/product
          key: sim2gse-${{ runner.os }}-${{ steps.compiler.outputs.sha256 }}-${{ hashFiles('projects/sim2gse/compatibility/lock.json', 'projects/sim2gse/native/patches/**', 'scripts/dev/sim2gse/build.py') }}
      - name: Prepare pinned tools and API references
        if: steps.changes.outputs.needs-build == 'true'
        shell: pwsh
        run: ./scripts/dev/setup.ps1
      - name: Prepare lightweight verification
        if: steps.changes.outputs.needs-build != 'true'
        shell: pwsh
        run: python -m venv .venv
      - name: Build all repository targets
        if: steps.changes.outputs.needs-build == 'true'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: build-and-verify build --project .
      - name: Save SimC build cache
        if: success() && steps.changes.outputs.needs-build == 'true' && steps.simc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/sim2gse-upstream/simc
            .tools/sim2gse/product
          key: sim2gse-${{ runner.os }}-${{ steps.compiler.outputs.sha256 }}-${{ hashFiles('projects/sim2gse/compatibility/lock.json', 'projects/sim2gse/native/patches/**', 'scripts/dev/sim2gse/build.py') }}
      - name: Full verification
        if: ${{ !cancelled() && steps.changes.outputs.needs-build == 'true' }}
        shell: pwsh
        env:
          BUILD_AND_VERIFY_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
        run: |
          $config = Get-Content .build-and-verify/config.json -Raw | ConvertFrom-Json
          ($config.verify.checks | Where-Object id -eq 'verify.sim2gse').pytestXdistWorkers = 2
          $config | ConvertTo-Json -Depth 100 | Set-Content .build-and-verify/config.json
          build-and-verify verify --project . --full
      - name: Changed-file verification
        if: ${{ !cancelled() && steps.changes.outputs.needs-build != 'true' }}
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: build-and-verify verify --project . --base $env:BASE_SHA
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          path: |
            .local/luals/
            .local/tests/
            .local/sim2gse/build/
            .build-and-verify/runs/
          if-no-files-found: ignore
