async function runCalc(payload,path='/api/calculate'){let retryEdit=null,applied=false;const id=++requestId;busy=true;['saveBtn','copyBtn','deleteBtn','saved','importBtn','exportBtn'].forEach(k=>$(k).disabled=true);started=performance.now();banner('');drawStats();drawEditor();try{const data=await api(path,payload);if(id!==requestId)return;model=data.model||model;model.name=$('buildName').value||'未命名方案';result=data;applied=true;if(!data.complete)banner(data.error,true);dirty=true;drawCharacter();}catch(e){if(e.alternativeLevel&&(payload.edit?.candidate!=null||payload.edit?.originalItem!=null)&&confirm(e.message+'确认按此装等替换？原宝石和附魔将在兼容时保留。'))retryEdit={...payload.edit,acceptLevelChange:e.alternativeLevel};else banner(e.message,true);if(!payload.edit)result={complete:false,error:e.message,model};}finally{if(id===requestId){busy=false;['saveBtn','copyBtn','deleteBtn','saved','importBtn','exportBtn'].forEach(k=>$(k).disabled=false);drawGear();drawStats();drawEditor()}}if(retryEdit)return await runCalc({...payload,edit:retryEdit},path);return applied}
async function edit(patch){if(busy)return;bulkChoice='current';await runCalc({model,edit:{slot:selected,...patch}})}
$('buildName').oninput=()=>{if(model)model.name=$('buildName').value;dirty=true};
function nameTaken(name,id=''){return builds.some(b=>b.id!==id&&b.model.name.trim()===name.trim())}
$('saveBtn').onclick=()=>{if(!model||busy)return;const name=$('buildName').value.trim()||'未命名方案';if(nameTaken(name,saveId)){banner('已有同名方案“'+name+'”，请修改名称后再保存。',true);$('buildName').focus();return}
const id=saveId||crypto.randomUUID(),nextModel={...clone(model),name},record={id,model:clone(nextModel),version:boot.version};
const nextBuilds=builds.some(b=>b.id===id)?builds.map(b=>b.id===id?record:b):[...builds,record];
try{localStorage.setItem(STORE,JSON.stringify(nextBuilds))}catch{toast('浏览器保存失败，请导出文件备份');return}
builds=nextBuilds;model=nextModel;saveId=id;rememberSavedLevels();rememberOriginalItems();drawGear();drawEditor();dirty=false;banner('');refreshMenus();drawStats();toast('已保存在此浏览器 · '+model.name)};
$('deleteBtn').onclick=()=>{if(busy)return;const target=builds.find(b=>b.id===saveId);if(!target){toast('请先选择一个已保存的方案');return}if(!confirm('删除已保存方案“'+buildLabel(target)+'”？'+(builds.length===1?'删除后回到空白初始状态。':'当前装备会保留为未保存的编辑。')))return;const remaining=builds.filter(b=>b.id!==target.id);try{localStorage.setItem(STORE,JSON.stringify(remaining))}catch{banner('删除失败，已保存方案保持不变。',true);return}builds=remaining;if($('compare').value===target.id){$('compare').value='';compareResult=null}saveId='';dirty=true;if(!builds.length){clearEditor();toast('已删除最后一个方案，已回到初始状态');return}refreshMenus();drawStats();banner('');toast('已删除方案，当前装备仍保留，可重新保存')};
$('copyBtn').onclick=()=>{if(!model||busy)return;$('saveAsName').value='';$('saveAsError').textContent='';$('saveAsDialog').showModal();$('saveAsName').focus()};
$('cancelSaveAs').onclick=()=>$('saveAsDialog').close();
$('saveAsForm').onsubmit=e=>{
 e.preventDefault();if(!model||busy)return;
 const name=$('saveAsName').value.trim();
 if(!name||name.length>60){$('saveAsError').textContent='请输入 1 至 60 个字的方案名称。';return}
 if(name===model.name.trim()||nameTaken(name)){$('saveAsError').textContent='名称不能与当前方案或已有方案相同，请输入其他名称。';$('saveAsName').focus();return}
 const nextModel=clone(model);nextModel.name=name;
 const id=crypto.randomUUID(),nextBuilds=[...builds,{id,model:clone(nextModel),version:boot.version}];
 try{localStorage.setItem(STORE,JSON.stringify(nextBuilds))}catch{$('saveAsError').textContent='保存失败，当前编辑与原方案均未修改，请重试或导出备份。';return}
 builds=nextBuilds;model=nextModel;saveId=id;dirty=false;
 if(result)result={...result,model:clone(model)};
 $('buildName').value=name;rememberSavedLevels();defaultComparison(id);
 $('saveAsDialog').close();banner('');toast('已另存并切换到“'+name+'”');
};
$('saved').onchange=async e=>{const b=builds.find(b=>b.id===e.target.value);if(!b)return;if(dirty&&!confirm('当前编辑尚未保存，切换方案？')){$('saved').value=saveId;return}if(b.version!==boot.version&&!confirm('此方案使用旧版数据，将用当前版本重新计算。继续？'))return;++compareRequest;compareResult=null;bulkChoice='current';model=clone(b.model);$('buildName').value=model.name;selected=null;await runCalc({model});saveId=b.id;rememberSavedLevels();dirty=false;$('saved').value=saveId;defaultComparison(b.id)};
$('compare').onchange=async e=>{const request=++compareRequest;compareResult=null;const id=e.target.value;
 if(id==='imported'){compareResult=clone(importComparison?.result);drawStats();return}
 if(id){const b=builds.find(b=>b.id===id);if(!b)return;if(b.version!==boot.version&&!confirm('对比方案需要使用当前版本重新计算，继续？')){e.target.value='';drawStats();return}try{const data=await api('/api/calculate',{model:b.model});if(request!==compareRequest)return;compareResult=data;if(!compareResult.complete)toast('对比方案未能完整计算，暂停比较')}catch(err){if(request!==compareRequest)return;toast(err.message)}}drawStats()};
$('exportBtn').onclick=()=>{if(!model)return;const blob=new Blob([JSON.stringify({format:'gear-planner-prototype/1',version:boot.version,model},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='装备方案.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出当前配置，包含不完整输入')};
$('importBtn').onclick=()=>{$('importError').textContent='';$('importDialog').showModal()};$('cancelImport').onclick=()=>$('importDialog').close();$('fileInput').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>131072){$('importError').textContent='文件过大';return}$('importText').value=await f.text()}};
$('doImport').onclick=async()=>{const text=$('importText').value.trim();if(!text){$('importError').textContent='请粘贴导出文本或选择文件';return}try{if(text.startsWith('{')){const data=JSON.parse(text);if(data.format!=='gear-planner-prototype/1'||!data.model)throw Error('无法识别此方案文件');if(data.version!==boot.version&&!confirm('文件版本不同，将按当前版本重算。继续？'))return;model=data.model;saveId='';bulkChoice='current';selected=null;$('buildName').value=model.name||'导入方案';await runCalc({model})}else{const data=await api('/api/import',{text});model=data.model;result=data;drawCharacter();$('buildName').value=model.name;dirty=true;saveId='';bulkChoice='current';selected=null;banner(data.complete?'':data.error,!data.complete);drawGear();drawStats();drawEditor()}defaultComparison();$('importDialog').close()}catch(e){$('importError').textContent=e.message}};
function clearEditor(){originalItems={};originalMatches={};originalMatchKey='';++compareRequest;importComparison=null;bulkChoice='current';statFilters=[];statMatch='any';$('statMatch').value='any';model=null;result=null;compareResult=null;selected=null;saveId='';dirty=false;$('buildName').value='';drawCharacter();$('compare').value='';banner('');refreshMenus();drawGear();drawStats();drawEditor()}
(async()=>{try{boot=await(await fetch('/api/bootstrap')).json();clearEditor();$('importBtn').disabled=false;}catch(e){banner('本地服务未准备好：'+e.message,true)}})();
</script></body></html>
